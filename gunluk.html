<!DOCTYPE html>
<html lang="tr">
<head>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Günlük</title>
    <link rel = "stylesheet" href = "gunluk-CSS.css">
    <script type = "text/javascript" src = "gunluk-JS.js"></script>
    
</head>
<body>
    
    <div class = "content">

       
        <div class = "islemkutusu-2">

            <div class = "aracCubugu" style = "display: inline-block;display: flex;">

                <a href = "gunluk-mektup.html"> <button style = "border-width:3px;border-color:rgb(0, 0, 0);border-radius:6px;color:white;background-color: rgba(63, 53, 200, 0.771);margin-bottom: 30px;">Anasayfaya dön</button></a>
       
            <div class = arac-1>

         <select class="form-select" id="fontSecici" 
         style="width: 150px;text-align: center;margin-left: 10px;font-size:15px;color: rgb(9, 0, 0);margin-bottom:10px;background-color: white;">
            
            <option>Yazı Tipi</option>
            <option value="none">Normal</option>
            <option value="Arial">Arial</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="'Courier New', monospace">Courier New</option>
            <option value="Georgia, serif">Georgia</option>
            <option value="Verdana, sans-serif">Verdana</option>
            <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
         
        </select>

            </div>

            <div class = "arac-2" style = "margin-left:20px;">

                <button type = "button" class = "btn btn-secondary" id="boldBtn" style = "background-color:white;color: black; "><b>B</b></button>
           </div>

           <div class="arac-3" style = "margin-left: 20px;">
    
            <button type="button" class="btn btn-secondary" id="italicBtn" style = "background-color:white;color: black; "><i>İ</i></button>
           
            </div>

            <div class="arac-4">
            
                <select class="form-select" id="boyutSecici" style="width: 85px; margin-left: 20px;">
                   
                    <option value="1">10px</option>
                    <option value="2">13px</option>
                    <option value="3" selected>16px</option>
                    <option value="4">18px</option>
                    <option value="5">24px</option>
                    <option value="6">32px</option>
                    <option value="7">48px</option>
               
                </select>
            </div>

        <div class="arac-5">
            <input type="color" id="renkSecici" value="#000000" title="Yazı rengi" style = "margin-left: 20px;margin-top: 5px;">
        </div>

          <div class = "arac-6">
            <button type="button" id = "sol-yazi"></button>
        </div>
        <div class = "arac-7">
            <button type="button" id = "orta-yazi"><h2>♥</h2></button>
        </div>
        <div class = "arac-8">
            <button type="button" id = "sag-yazi"></button>
        </div>

    </div>

    <div class = "Toplam-Orta-islem" style="display: flex;">
    
    <div style = "display: flex;">


     <div class = "gunlukk" style = "float: left;">
    

       <div class = "sag-sayfa-acik">

        <div id="editor" contenteditable="true" spellcheck="false" style = "margin-top: 20px;float: left;"></div>

       </div>
    </div>


    </div>
    <div class = "sag-taraff" style = "float:left">

    <div class = "gorselKoymaKutu" style="float: left;">

      <input type="file" id="galeriInput" accept="image/*" style="display:none">
      <button id="gorselAcBtn">Görsel Ekle</button>
      
    </div>

    
    <div id = "silKutusu" class = "sil-kutusu"  title = "görseli buraya sürükle">Görseli Kaldır</div>

      <div class = "oklar" style = "float: left;">

       <button type="button" class = "btn-sag" id = "sagOk" title = "diğer sayfaya geç"></button>

       <button type="button" class="btn-sol" id="solOk" style="display:none;" title = "bir önceki sayfaya dön"></button>

      </div>

    </div>

</div>

   
</div>
    
   

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>

</body>
</html>
